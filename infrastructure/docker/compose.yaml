# Base compose file — infrastructure + app services.
# Spec: 27-INFRASTRUCTURE.md §2, 28-REPOSITORY-STRUCTURE.md §8, 35 §15.

name: acos

networks:
  default: {}
  # S8: workspace containers live here; internal => no default route out.
  # The ONLY way out is egress-proxy. Subnet pinned to match squid.conf's
  # `acl workspaces src 172.30.0.0/16`.
  acos-workspaces:
    name: acos-workspaces
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/16

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: acos
      POSTGRES_PASSWORD: acos
      POSTGRES_DB: acos
    ports:
      - "5432:5432"
    volumes:
      - "${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acos -d acos"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
    volumes:
      - "${DATA_DIR:-./data}/nats:/data"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: acos
      POSTGRES_PWD: acos
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DEFAULT_NAMESPACE: acos
      DEFAULT_NAMESPACE_RETENTION: 7d
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 | grep -q SERVING"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  server:
    image: acos/server
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args:
        APP_FILTER: "@acos/server"
        APP_MAIN: apps/server/dist/main.js
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_PORT: "3000"
      DATABASE_URL: postgres://acos:acos@postgres:5432/acos
      NATS_URL: nats://nats:4222
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: acos
      SANDBOX_MANAGER_URL: http://sandbox-manager:3010
    ports:
      # Container always listens on 3000; host side is overridable because dev
      # machines may already occupy 3000 (SERVER_PORT is only interpolated here,
      # the container env above pins the internal port).
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: acos/web
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      target: prod
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  agent-worker:
    image: acos/agent-worker
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args:
        APP_FILTER: "@acos/agent-worker"
        APP_MAIN: workers/agent-worker/dist/main.js
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTH_PORT: "3020"
      DATABASE_URL: postgres://acos:acos@postgres:5432/acos
      NATS_URL: nats://nats:4222
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: acos
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3020/healthz > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  execution-worker:
    image: acos/execution-worker
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args:
        APP_FILTER: "@acos/execution-worker"
        APP_MAIN: workers/execution-worker/dist/main.js
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTH_PORT: "3021"
      NATS_URL: nats://nats:4222
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: acos
      SANDBOX_MANAGER_URL: http://sandbox-manager:3010
    depends_on:
      nats:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3021/healthz > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  sandbox-manager:
    image: acos/sandbox-manager
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.node
      args:
        APP_FILTER: "@acos/sandbox-manager"
        APP_MAIN: services/sandbox-manager/dist/main.js
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SANDBOX_MANAGER_PORT: "3010"
      NATS_URL: nats://nats:4222
    volumes:
      # S1: the ONLY service that mounts the Docker socket.
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock"
      - "${DATA_DIR:-./data}:/data"
    networks:
      - default
      - acos-workspaces
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3010/healthz > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  egress-proxy:
    image: acos/egress-proxy
    build:
      context: egress-proxy
    networks:
      - default
      - acos-workspaces
    healthcheck:
      test: ["CMD-SHELL", "squid -k check"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
