# Base compose file — infrastructure services (T01/T04 scope).
# App services (server, web, workers, sandbox-manager, egress-proxy) land in T05.
# Spec: 27-INFRASTRUCTURE.md §2, 28-REPOSITORY-STRUCTURE.md §8, 35 §15.

name: acos

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: acos
      POSTGRES_PASSWORD: acos
      POSTGRES_DB: acos
    ports:
      - "5432:5432"
    volumes:
      - "${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acos -d acos"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
    volumes:
      - "${DATA_DIR:-./data}/nats:/data"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: acos
      POSTGRES_PWD: acos
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DEFAULT_NAMESPACE: acos
      DEFAULT_NAMESPACE_RETENTION: 7d
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 | grep -q SERVING"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
